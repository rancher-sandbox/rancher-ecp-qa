name: "[updatecli] Bump GitHub Runner"
pipelineid: "github_runner_update"

sources:
  runnerVersion:
    name: "Get latest GitHub Runner version"
    kind: "githubrelease"
    spec:
      owner: "actions"
      repository: "runner"
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
    transformers:
      - trimprefix: "v"

  runnerShaX64:
    name: "Get GitHub Runner x64 SHA256"
    kind: "shell"
    dependson:
      - runnerVersion
    spec:
      command: >
        curl -fsSL https://api.github.com/repos/actions/runner/releases/tags/v{{ source "runnerVersion" }}
        | jq -r '.assets[] | select(.name == "actions-runner-linux-x64-{{ source "runnerVersion" }}.tar.gz")
        | .digest | sub("^sha256:"; "")'

  runnerShaArm64:
    name: "Get GitHub Runner ARM64 SHA256"
    kind: "shell"
    dependson:
      - runnerVersion
    spec:
      command: >
        curl -fsSL https://api.github.com/repos/actions/runner/releases/tags/v{{ source "runnerVersion" }}
        | jq -r '.assets[] | select(.name == "actions-runner-linux-arm64-{{ source "runnerVersion" }}.tar.gz")
        | .digest | sub("^sha256:"; "")'

targets:
  runnerVersion:
    name: "Update RUNNER_VERSION default"
    kind: "file"
    sourceid: runnerVersion
    # {{ if .scm.enabled }}
    scmid: default
    actionid: default
    # {{ end }}
    spec:
      file: "scripts/gcp-template-tofu/configure-gh-runner.sh"
      matchpattern: 'RUNNER_VERSION=".*"'
      replacepattern: 'RUNNER_VERSION="{{ source "runnerVersion" }}"'

  runnerShaX64:
    name: "Update x64 RUNNER_SHA256 default"
    kind: "file"
    sourceid: runnerShaX64
    # {{ if .scm.enabled }}
    scmid: default
    actionid: default
    # {{ end }}
    spec:
      file: "scripts/gcp-template-tofu/configure-gh-runner.sh"
      matchpattern: 'RUNNER_SHA256=".*" # x64'
      replacepattern: 'RUNNER_SHA256="{{ source "runnerShaX64" }}" # x64'

  runnerShaArm64:
    name: "Update ARM64 RUNNER_SHA256 default"
    kind: "file"
    sourceid: runnerShaArm64
    # {{ if .scm.enabled }}
    scmid: default
    actionid: default
    # {{ end }}
    spec:
      file: "scripts/gcp-template-tofu/configure-gh-runner.sh"
      matchpattern: 'RUNNER_SHA256=".*" # arm64'
      replacepattern: 'RUNNER_SHA256="{{ source "runnerShaArm64" }}" # arm64'

  manualActionNeededX64:
    dependsOn:
      - source.runnerVersion
      - source.runnerShaX64
    name: '⚠️  ACTION REQUIRED (x64): echo -n "{{ source "runnerVersion" }}:{{ source "runnerShaX64" }}" | gcloud secrets versions add RUNNER_VERSION_SHA256 --data-file=-'
    kind: "shell"
    disablesourceinput: true
    spec:
      command: "true"

  manualActionNeededArm64:
    dependsOn:
      - source.runnerVersion
      - source.runnerShaArm64
    name: '⚠️  ACTION REQUIRED (ARM64): echo -n "{{ source "runnerVersion" }}:{{ source "runnerShaArm64" }}" | gcloud secrets versions add RUNNER_VERSION_SHA256_ARM64 --data-file=-'
    kind: "shell"
    disablesourceinput: true
    spec:
      command: "true"
